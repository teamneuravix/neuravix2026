# slam_toolbox localization - GERÇEK ARAÇ (YARIŞ MODU)
# Sim config'ten (slam_toolbox_pist_localization.yaml) farklar:
#   - base_frame: ego_vehicle -> base_link
#   - use_sim_time: false
#   - max_laser_range: 100 -> 30 (mapping config'i ile TUTARLI olmalı;
#     harita 30 m ile çıkarıldıysa lokalizasyon da 30 m ile eşleştirmeli)
#   - map_file_name BURADA YOK: launch'tan map_file argümanıyla geçiliyor
#     (harita yolu araçta/container'da değişebilir, config'e gömme)
# Kalanlar sim ile birebir aynı.
slam_toolbox:
    ros__parameters:
        # --- Frame'ler ---
        odom_frame: odom
        map_frame: map
        base_frame: base_link
        # /scan değil: host velodyne_laserscan_node çakışması (bkz. mapping config)
        scan_topic: /scan_bee1

        # --- MOD: localization (haritalama DEĞİL, hazır haritada konumlan) ---
        mode: localization

        # Başlangıç pozu [x, y, yaw] - araç haritada nerede başlıyor.
        # Harita çıkarma turu start çizgisinden başladıysa [0,0,0] doğrudur.
        # Değilse RViz "2D Pose Estimate" ile elle verilebilir.
        map_start_pose: [0.0, 0.0, 0.0]

        use_sim_time: false

        # --- Scan eşleştirme ---
        resolution: 0.05
        max_laser_range: 30.0
        minimum_travel_distance: 0.1
        minimum_travel_heading: 0.3
        transform_publish_period: 0.02
        map_update_interval: 1.0

        use_scan_matching: true
        use_scan_barycenter: true
        # localization modunda scan_buffer_size = dairesel tampon boyutu
        scan_buffer_size: 20
        # 0.1 -> 0.12 (EKF_DRIFT_COZUMU.txt): harita hangi seciciligle
        # cikarildiysa localization da benzer seciciligle eslessin.
        link_match_minimum_response_fine: 0.12
        correlation_search_space_dimension: 0.5

        throttle_scans: 5
        transform_timeout: 1.0
        tf_buffer_duration: 30.0
        stack_size_to_use: 40000000
