slam_toolbox:
    ros__parameters:
        # --- Frame'ler ---
        # CARLA map->ego_vehicle veriyor ama biz odom->ego_vehicle koprusu
        # kuruyoruz (pist_odom_tf). slam_toolbox map->odom uretir.
        odom_frame: odom
        map_frame: map
        base_frame: ego_vehicle
        scan_topic: /scan

        # --- Mod ---
        mode: mapping              # haritalama. (yarista localization moduna alinir)
        use_sim_time: true

        # --- Scan eslestirme ---
        resolution: 0.05           # harita cozunurlugu (m/hucre)
        max_laser_range: 100.0
        minimum_travel_distance: 1.0
        minimum_travel_heading: 0.5
        transform_publish_period: 0.02
        map_update_interval: 1.0

        # --- Loop closure (pist turu icin onemli) ---
        do_loop_closing: true
        loop_search_maximum_distance: 8.0
        loop_match_minimum_chain_size: 10

        # --- Scan matcher ---
        use_scan_matching: true
        use_scan_barycenter: true
        scan_buffer_size: 10
        link_match_minimum_response_fine: 0.1
        correlation_search_space_dimension: 0.5

        # --- Performans ---
        throttle_scans: 1
        transform_timeout: 0.2
        tf_buffer_duration: 30.0
        stack_size_to_use: 40000000
